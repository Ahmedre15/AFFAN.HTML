    <p><dd>Regime change is the forcible or coerced replacement of one government regime with another. Regime change may replace all or part of the state's most critical leadership system, administrative apparatus, or bureaucracy. Regime change may occur through domestic processes, such as revolution, coup, or reconstruction of government following state failure or civil war.[1] It can also be imposed on a country by foreign actors through invasion, overt or covert interventions, or coercive diplomacy.[2][3] In addition to replacing one government with another, regime change may entail the construction of new institutions, the restoration of old institutions, and the promotion of new ideologies.[2]

        According to a dataset by Alexander Downes, 120 leaders were removed through foreign-imposed regime change between 1816 and 2011 <br>Internal regime change
        Regime change can be precipitated by revolution or a coup d'état. The 1917 Russian Revolution, the 1962 Burmese coup, the 1979 Iranian Revolution and the 1990 dissolution of the Eastern Bloc are consummate examples. Examples of internally driven regime change are the establishment of the French Fifth Republic (1958) and the Federation of Australia.
        
        Foreign-imposed regime change
        Foreign-imposed regime change is the deposing of a regime by a foreign state, which can be achieved through covert means or by direct military action. Interstate war can also culminate into a foreign-imposed regime change for the losers, as occurred for the Axis Powers in 1945. Foreign-imposed regime change is sometimes used by states as a foreign policy tool.[4] According to a dataset by Alexander Downes, 120 leaders have been successfully removed through foreign-imposed regime change between 1816 and 2011.[2]
        
        During the Cold War, the United States frequently intervened in elections and engaged in attempts at regime change, both covertly and overtly.[5][6][7] According to Michael Poznansky, covert regime change became more common when non-intervention was codified into international law, leading states that wanted to engage in regime change to do so covertly and conceal their violations of international law.[8]
        
        Regime promotion
        According to John Owen IV, there are four historical waves of forcible regime promotion:[9]
        
        Catholicism vs Protestantism: From the 1520s to the early 18th century
        Republicanism vs Constitutional monarchy vs Absolute monarchy: From the 1770s to the late 19th century
        Communism vs Liberalism vs Fascism: From the late 1910s to the 1980s
        Secular government vs Islamism: post-1990
        Impact
        Studies by Alexander Downes, Lindsey O'Rourke and Jonathan Monten indicate that foreign-imposed regime change seldom reduces the likelihood of civil war,[2] violent removal of the newly imposed leader,[2] and the probability of conflict between the intervening state and its adversaries,[10][2] as well as does not increase the likelihood of democratization (unless regime change comes with pro-democratic institutional changes in countries with favorable conditions for democracy).[11] Downes argues,[2]
        
        The strategic impulse to forcibly oust antagonistic or non-compliant regimes overlooks two key facts. First, the act of overthrowing a foreign government sometimes causes its military to disintegrate, sending thousands of armed men into the countryside where they often wage an insurgency against the intervener. Second, externally-imposed leaders face a domestic audience in addition to an external one, and the two typically want different things. These divergent preferences place imposed leaders in a quandary: taking actions that please one invariably alienates the other. Regime change thus drives a wedge between external patrons and their domestic protégés or between protégés and their people.
        
        Research by Nigel Lo, Barry Hashimoto, and Dan Reiter has contrasting findings, as they find that interstate "peace following wars last longer when the war ends in foreign-imposed regime change."[12] However, research by Reiter and Goran Peic finds that foreign-imposed regime change can raise the probability of civil war.[ <br> Former prime minister Imran Khan on Friday said that the United States (US) backed regime change because it wanted to have military bases in Pakistan and use the country once again to meet its foreign policy objectives in the region and beyond.

        The former premier said that the US once again wants to have bases in Pakistan and use the country against Russia, saying the issue was going on between the US and Russia but Pakistan can’t import cheap oil and gas from Russia; a condition that doesn’t apply to India.
        
        “Those who have powers; those who are our neutrals; those who now say that we have taken a step back and become neutral; isn’t this their Pakistan,” Imran, who is the chairman of the Pakistan Tehreek-e-Insaf (PTI), said. “Won’t they suffer if the economy goes down.”
        
        Read more: ‘Below me to respond to compulsive liar like Imran,’ says ex-brigadier

        “Is this in Pakistan’s interest,” Imran asked. “If we think that our interest is with these ‘thieves’ then we don’t have any future.”
        
        Speaking at a seminar titled ‘Regime Change: Impact on Politics, Security and Economy’ organised by Islamabad Policy Institute (IPI), he said the regime change has profoundly harmed Pakistan.
        
        During his tenure, Imran had repeatedly said that giving military bases to the US for its future operations in Afghanistan was out of the question. At one point, Imran had categorically said that Pakistan would “absolutely not” allow any bases to the US and use of its territory for any sort of action inside Afghanistan.

        The PTI chairman recalled that Pakistan paid a huge price for taking part in the war on terror but the US never even thanked it for standing by it, adding that the reason was that “we allow others to use us like tissue paper”.
